[project]
name = "aiteamos-slack-notification-connector"
version = "0.1.0"
description = "Reference Slack notification connector template for AITEAMOS"
requires-python = ">=3.11"
dependencies = ["aiteamos>=0.1.0"]

[project.entry-points."aiteamos.connectors"]
slack_notification = "aiteamos_slack_notification_connector:connector_package"

[tool.setuptools.packages.find]
where = ["src"]
