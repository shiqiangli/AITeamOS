apiVersion: aiteamos.dev/v1alpha1
kind: Project
metadata:
  name: protocol-fixture
  title: Protocol Fixture
  createdAt: "2026-05-21T08:00:00+08:00"
spec:
  description: >
    A neutral compiler demo project for showing AITEAMOS TeamMember-centric
    operations across a protocol fixture, runtime contract, human review, hybrid
    release work, service automation, and neutral memory promotion.
  repositories:
    - repositories/protocol-fixture.yaml
  defaultRepository: protocol-fixture
  workspaceMode: embedded
  publicDataPolicy:
    coreRepoContainsRealExternalProjectData: false
    publicDemoWorkspace: false
    protocolTestFixtureOnly: true
    privateProjectsShouldUseShadowWorkspace: true
  ruleEntrypoints:
    - README.md
  defaultExecutionMode: assisted
  deliveryStrategy:
    name: browsable-team-member-os-demo
    primaryJourneys:
      - digital managed run with reviewed memory promotion
      - hybrid assisted ingest with handoff evidence
      - service automation with permission-gated dry run
    schemaSourceOfTruth:
      language: python
      library: pydantic
