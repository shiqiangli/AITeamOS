apiVersion: aiteamos.dev/v1alpha1
kind: PermissionPolicy
metadata:
  name: human-default
spec:
  scope:
    memberKind: human
  defaultMode: ask
  allow:
    - match: Read(/README.md)
    - match: Read(/docs/**)
    - match: Read(/src/**)
    - match: Read(/tests/**)
    - match: Edit(/docs/**)
    - match: mcp__aiteamos__approve_memory
      reason: Human reviewers can approve memory with audit evidence.
  ask:
    - match: Edit(/src/**)
    - match: Bash(pytest:*)
  deny:
    - match: EnvVar(*:read)
    - match: Bash(rm -rf:*)
  sensitivePaths:
    - .env
    - .git/**
