apiVersion: aiteamos.dev/v1alpha1
kind: PermissionPolicy
metadata:
  name: digital-default
spec:
  scope:
    memberKind: digital
  defaultMode: ask
  allow:
    - match: Read(/README.md)
    - match: Read(/docs/**)
    - match: Read(/src/**)
    - match: Read(/tests/**)
    - match: Edit(/src/**)
    - match: Edit(/tests/**)
    - match: mcp__aiteamos__record_journal
      reason: Run journals are audited workspace state.
    - match: mcp__aiteamos__propose_memory
      reason: Digital members may propose but not approve memory.
  ask:
    - match: Edit(/docs/**)
    - match: Bash(pytest:*)
    - match: WebFetch(docs.qoder.com)
      reason: External product references must remain visible to human reviewers.
  deny:
    - match: Edit(/.git/**)
    - match: EnvVar(*:read)
      reason: Secret values must never enter context.
    - match: Bash(rm -rf:*)
  sensitivePaths:
    - .env
    - .git/**
    - "*.pem"
  inheritance:
    projectPolicy: merge
