apiVersion: aiteamos.dev/v1alpha1
kind: RoleTemplate
metadata:
  name: runtime-engineer
spec:
  summary: Implements lowering and runtime integration with tests.
  reusableAcrossProjects: true
  defaultResponsibilities:
    - Implement conversion code under scoped write permissions.
    - Produce test evidence and memory proposals.
  defaultOutputs:
    - Diff patch
    - Test log
    - Pending memory proposal
