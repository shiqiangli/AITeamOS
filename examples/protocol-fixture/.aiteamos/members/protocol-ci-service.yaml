apiVersion: aiteamos.dev/v1alpha1
kind: TeamMember
metadata:
  name: protocol-ci-service
  title: CI Service Account
spec:
  kind: service
  profile:
    displayName: CI Service Account
    title: Memory health and planning automation
    status: active
    summary: Runs dry-run health checks and task-planning automations under service policy.
  aboutMe:
    coreCapabilities:
      - memory health checks
      - task planning dry runs
      - audit log emission
    workStyle:
      - deterministic
      - fail-closed
    workMethod:
      - never-approve-memory
      - never-start-worker
  projects:
    - project: protocol-fixture
      assignments:
        - ci-automation
      responsibilities:
        - Keep service automation observable and permission gated.
  permissionPolicies:
    - service-ci-default
  memoryStores:
    - protocol-project-memory
