apiVersion: aiteamos.dev/v1alpha1
kind: BudgetPolicy
metadata:
  name: demo-budget
spec:
  scope:
    project: protocol-fixture
  limits:
    softInputTokensPerRun: 120000
    softOutputTokensPerRun: 16000
    softRetriesPerRun: 1
    maxInputTokensPerRun: 160000
    maxOutputTokensPerRun: 24000
    maxRetriesPerRun: 2
  rateLimit:
    requestsPerMinute: 5
  fallback:
    allowModelFallback: false
    maxFallbacksPerRun: 0
  enforcement:
    onSoftLimit: warn
    onHardLimit: stop-run
