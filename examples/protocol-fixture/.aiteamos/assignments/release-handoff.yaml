apiVersion: aiteamos.dev/v1alpha1
kind: Assignment
metadata:
  name: release-handoff
spec:
  member: protocol-release-hybrid
  project: protocol-fixture
  roleTemplate: release-reviewer
  roleContext: assisted-release-owner
  title: Hybrid release and handoff owner
  status: active
  repositories:
    - protocol-fixture
  modules:
    - docs/
    - .aiteamos/im/
  features:
    - assisted-ingest
    - handoff-synthesis
  responsibilities:
    - Ingest runtime handoff notes, diff, tests, and release documentation.
    - Keep proposed memory pending for human approval.
  scope:
    repositories:
      - protocol-fixture
    read:
      - README.md
      - docs/**
      - src/**
      - tests/**
      - .aiteamos/im/**
      - .aiteamos/memory/**
    write:
      - docs/**
      - .aiteamos/runs/**
      - .aiteamos/memory/proposals/**
    requiresHumanReview:
      - .aiteamos/memory/entries/**
      - .aiteamos/memory/bindings/**
  permissionPolicies:
    - hybrid-default
  memoryBindings:
    - bind-runtime-contract-to-project
