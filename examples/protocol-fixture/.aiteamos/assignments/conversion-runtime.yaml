apiVersion: aiteamos.dev/v1alpha1
kind: Assignment
metadata:
  name: conversion-runtime
spec:
  member: protocol-runtime-bot
  project: protocol-fixture
  roleTemplate: runtime-engineer
  roleContext: runtime-implementation
  title: Runtime and runtime integration
  status: active
  repositories:
    - protocol-fixture
  modules:
    - src/pure_function.py
    - tests/test_pure_function.py
  features:
    - runtime.add_i32
    - operand-order-regression
  responsibilities:
    - Implement runtime in scoped source files.
    - Produce test logs and pending memory proposals with lineage.
  scope:
    repositories:
      - protocol-fixture
    read:
      - README.md
      - docs/**
      - src/**
      - tests/**
      - .aiteamos/memory/**
    write:
      - src/pure_function.py
      - tests/test_pure_function.py
      - .aiteamos/runs/**
      - .aiteamos/memory/proposals/**
    requiresHumanReview:
      - src/**
      - .aiteamos/memory/entries/**
      - .aiteamos/memory/bindings/**
  permissionPolicies:
    - digital-default
  memoryBindings:
    - bind-runtime-contract-to-runtime
