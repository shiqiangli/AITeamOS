apiVersion: aiteamos.dev/v1alpha1
kind: ModelProfile
metadata:
  name: demo-gpt-5.5-xhigh
spec:
  provider: openai
  model: gpt-5.5
  displayName: Demo GPT-5.5 Extra High
  gateway: openai-responses
  secretEnv: OPENAI_API_KEY
  invocation:
    reasoningEffort: xhigh
    reasoningSummary: auto
    maxOutputTokens: 4096
    timeoutSeconds: 240
  capabilities:
    - managed_llm
    - assisted
    - coding
    - review
  defaultForMembers:
    - protocol-architect
    - protocol-runtime-bot
  defaultForAssignments:
    - protocol-design
    - conversion-runtime
