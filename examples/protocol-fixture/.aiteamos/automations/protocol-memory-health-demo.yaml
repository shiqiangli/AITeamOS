apiVersion: aiteamos.dev/v1alpha1
kind: Automation
metadata:
  name: protocol-memory-health-demo
spec:
  ownerMember: protocol-reviewer-human
  serviceMember: protocol-ci-service
  project: protocol-fixture
  targetType: memory_health
  target:
    store: protocol-project-memory
    reportScope: project
  triggers:
    - triggerType: manual
      config:
        preset: public-demo
    - triggerType: memory_stale_conflict
      config:
        store: protocol-project-memory
  dryRun: true
  status: active
  permissionPolicies:
    - service-ci-default
  approvalGates:
    - human-memory-review
