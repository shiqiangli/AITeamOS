apiVersion: aiteamos.dev/v1alpha1
kind: Automation
metadata:
  name: protocol-task-planning-demo
spec:
  ownerMember: protocol-reviewer-human
  serviceMember: protocol-ci-service
  project: protocol-fixture
  targetType: task_planning
  target:
    project: protocol-fixture
    goal: Plan the next Add i32 release hardening slice.
    subtasks:
      - title: Add negative test for unsupported operands
        assignedMember: protocol-runtime-bot
        assignment: conversion-runtime
      - title: Review release note wording
        assignedMember: protocol-release-hybrid
        assignment: release-handoff
  triggers:
    - triggerType: manual
      config:
        preset: public-demo
  dryRun: true
  status: active
  permissionPolicies:
    - service-ci-default
  approvalGates:
    - human-planning-review
