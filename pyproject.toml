[project]
name = "aiteamos"
version = "1.0.0"
description = "AITeamOS - Agent Team OS (file-first P0)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "ag-ui-langgraph[fastapi]>=0.0.37,<0.1",
]

[project.optional-dependencies]
graphiti = [
  "graphiti-core>=0.20,<1",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = [
  "aiteamos_shared*",
  "aiteamos_api*",
]
where = [
  "packages/shared_kernel",
  "services/api",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = [
  "packages/shared_kernel",
  "services/api",
]
