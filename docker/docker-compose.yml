# AITeamOS 开发环境 Docker Compose
# 启动: cd docker && docker compose up -d
#
# File-first 1.0 service: Neo4j for the optional Graphiti Memory backend.

services:
  # --------------------------------------------------------------------------
  # Neo4j 5.26 for Graphiti temporal knowledge graph
  # --------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.26-community
    container_name: aiteamos-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${AITEAMOS_NEO4J_PASSWORD:?Set AITEAMOS_NEO4J_PASSWORD before starting Neo4j}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4jdata:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p ${AITEAMOS_NEO4J_PASSWORD:?Set AITEAMOS_NEO4J_PASSWORD before starting Neo4j} 'RETURN 1' || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  neo4jdata:
