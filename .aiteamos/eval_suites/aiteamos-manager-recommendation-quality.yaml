apiVersion: aiteamos.dev/v1alpha1
kind: EvalSuite
metadata:
  id: aiteamos-manager-recommendation-quality
  title: Manager recommendation quality
  createdAt: "2026-05-22T21:58:37.092+08:00"
spec:
  project: aiteamos
  purpose: Pair manager plan-recommendation messages with human accepted or rejected outcomes so model profile selection can use reviewable quality evidence.
  members:
    - aiteamos-manager
  assignments:
    - aiteamos-manager
  tasks:
    - TASK-20260522T222752655
  goldenOutputs:
    paired-outcome-contract:
      requiredFields:
        - MemberMessage.spec.messageType=plan-recommendation
        - MemberMessage.spec.resolvedByMember
        - MemberMessage.spec.resolution
        - MemberMessage.spec.audit.humanOutcome
        - MemberMessage.spec.attachments -> TaskPlan
    model-profile-basis:
      modelProfile: openai-gpt-5.5-xhigh
      selectionRule: The manager execution profile may keep this model profile while recent manager EvalResults stay above threshold.
  judge:
    kind: policy
    policyRef: digital-default
    modelProfile: openai-gpt-5.5-xhigh
    rubric:
      - Every scored manager recommendation must pair a plan-recommendation message with a human outcome.
      - Accepted and rejected outcomes both count as useful quality evidence when the pairing is explicit.
      - Model profile selection evidence is read-only and does not grant manager approval authority.
    passCriteria:
      minimumPairedRecommendations: 2
      minimumAcceptanceRate: 0.5
      requiredModelProfile: openai-gpt-5.5-xhigh
  policy:
    autoPromoteThreshold: 0.5
    minCases: 2
    requireAllGoldenOutputs: true
  cases:
    - id: accepted-manager-recommendation
      title: Accepted manager recommendation is paired with human resolution
      task: TASK-20260522T222752655
      member: aiteamos-manager
      assignment: aiteamos-manager
      input:
        message: MSG-20260522T215837092
        taskPlan: PLAN-20260522T215837092
        humanOutcome: accepted
      expected:
        outcome: Accepted recommendation remains paired with the reviewed TaskPlan.
      goldenOutputRefs:
        - paired-outcome-contract
        - model-profile-basis
      tags:
        - manager
        - eval
        - model-profile
    - id: rejected-manager-recommendation
      title: Rejected manager recommendation is paired with human resolution
      task: TASK-20260522T222752655
      member: aiteamos-manager
      assignment: aiteamos-manager
      input:
        message: MSG-20260522T215837193
        taskPlan: PLAN-20260522T215837193
        humanOutcome: rejected
      expected:
        outcome: Rejected recommendation remains evidence for future manager model profile selection.
      goldenOutputRefs:
        - paired-outcome-contract
        - model-profile-basis
      tags:
        - manager
        - eval
        - model-profile
  metrics:
    - manager-recommendation-pairing
    - manager-acceptance-rate
    - model-profile-selection-basis
