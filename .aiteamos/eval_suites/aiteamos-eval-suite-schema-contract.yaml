apiVersion: aiteamos.dev/v1alpha1
kind: EvalSuite
metadata:
  id: aiteamos-eval-suite-schema-contract
  title: EvalSuite schema contract
  createdAt: "2026-05-22T20:31:28.919+08:00"
spec:
  project: aiteamos
  purpose: Validate the source-of-truth EvalSuite manifest contract before it is consumed by readiness, review, or memory promotion gates.
  members:
    - backend-digital
    - architect
  assignments:
    - aiteamos-backend-runtime
    - aiteamos-architecture
  tasks:
    - TASK-20260520T104310792
  goldenOutputs:
    schema-contract:
      requiredFields:
        - cases
        - goldenOutputs
        - judge.kind
        - policy.autoPromoteThreshold
      schemaSource: packages/schema/aiteamos_schema/models.py
      generatedArtifacts:
        - packages/schema/generated/aiteamos.schema.json
        - packages/schema/generated/openapi.json
        - apps/dashboard/src/generated/aiteamos-schema.ts
    workspace-validation:
      requiredChecks:
        - suite project matches workspace project
        - suite/case member references exist
        - suite/case assignment references exist
        - suite/case task references exist
        - case goldenOutputRefs resolve inside suite goldenOutputs
  judge:
    kind: policy
    policyRef: digital-default
    modelProfile: openai-gpt-5.5-xhigh
    rubric:
      - Pydantic remains the source of truth for EvalSuite fields.
      - Workspace validation must fail closed on unresolved manifest references.
      - Generated JSON Schema, OpenAPI, and TypeScript must expose the same contract.
    passCriteria:
      requiredCommands:
        - python -m unittest discover tests -q
        - ./aiteamos workspace validate --workspace .aiteamos
        - ./aiteamos workspace index --workspace .aiteamos
  policy:
    autoPromoteThreshold: 0.95
    minCases: 2
    requireAllGoldenOutputs: true
  cases:
    - id: eval-suite-pydantic-contract
      title: EvalSuite Pydantic contract is schema-backed
      task: TASK-20260520T104310792
      member: backend-digital
      assignment: aiteamos-backend-runtime
      input:
        command: python -m unittest tests.test_schema_export -q
      expected:
        outcome: Pydantic, JSON Schema, OpenAPI, and TypeScript expose EvalSuite judge, policy, cases, and golden outputs.
      goldenOutputRefs:
        - schema-contract
      tags:
        - schema
        - eval
    - id: eval-suite-workspace-validation
      title: EvalSuite manifest references validate against the workspace index
      task: TASK-20260520T104310792
      member: backend-digital
      assignment: aiteamos-backend-runtime
      input:
        command: ./aiteamos workspace validate --workspace .aiteamos
      expected:
        outcome: Workspace validation returns 0 errors and 0 warnings with the self-hosting EvalSuite loaded.
      goldenOutputRefs:
        - workspace-validation
      tags:
        - workspace
        - eval
  metrics:
    - schema-contract-pass
    - workspace-reference-integrity
