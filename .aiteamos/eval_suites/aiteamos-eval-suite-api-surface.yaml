apiVersion: aiteamos.dev/v1alpha1
kind: EvalSuite
metadata:
  id: aiteamos-eval-suite-api-surface
  title: API surface self-bootstrap gate
  createdAt: "2026-05-22T21:24:01.445+08:00"
spec:
  project: aiteamos
  purpose: Ensure changes to the API app composition surface preserve the canonical API surface contract before architecture-owned work can enter review.
  members:
  - architect
  assignments:
  - aiteamos-architecture
  tasks:
  - TASK-20260520T101022277
  goldenOutputs:
    api-surface-contract:
      targetPath: services/api/aiteamos_api/app.py
      requiredCommand: PYTHONPATH=packages/schema:packages/workspace:services/api:services/worker:. python -m unittest tests.test_api_surface
      requiredBehavior:
      - Workspace index and project/employee projections remain v2 canonical.
      - Git activity import/correlation endpoints preserve reviewed admission boundaries.
      - API response payloads stay schema-compatible with dashboard and workspace projections.
    review-gate-blocker:
      expectedMessage: Latest EvalResult for aiteamos-eval-suite-api-surface must pass with passRate 1.0 before review gate allows an app.py patch.
  judge:
    kind: policy
    policyRef: digital-default
    modelProfile: openai-gpt-5.5-xhigh
    rubric:
    - API app composition must preserve the canonical API surface test.
    - Review gate must consume the latest EvalResult before allowing app.py changes.
    - The suite is source-of-truth workspace data, not a derived cache.
    passCriteria:
      requiredCommands:
      - PYTHONPATH=packages/schema:packages/workspace:services/api:services/worker:. python -m unittest tests.test_api_surface
      - ./aiteamos workspace validate --workspace .aiteamos
      - ./aiteamos workspace index --workspace .aiteamos
  policy:
    autoPromoteThreshold: 1.0
    minCases: 1
    requireAllGoldenOutputs: true
  cases:
  - id: api-surface-contract
    title: API surface test remains green for app.py changes
    task: TASK-20260520T101022277
    member: architect
    assignment: aiteamos-architecture
    input:
      changedPath: services/api/aiteamos_api/app.py
      command: PYTHONPATH=packages/schema:packages/workspace:services/api:services/worker:. python -m unittest tests.test_api_surface
    expected:
      outcome: tests.test_api_surface passes before review gate allows the app.py patch.
    goldenOutputRefs:
    - api-surface-contract
    - review-gate-blocker
    tags:
    - api
    - self-bootstrap
    - review-gate
  metrics:
  - api-surface-pass
  - review-gate-eval-blocker
