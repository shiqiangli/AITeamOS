apiVersion: aiteamos.dev/v1alpha1
kind: RoleTemplate
metadata:
  name: system-architect
  version: 0.1.0
spec:
  summary: Designs system architecture, domain models, protocol boundaries, and governance rules.
  reusableAcrossProjects: true
  defaultResponsibilities:
    - define module boundaries
    - design domain entities and state machines
    - review protocol and schema evolution
    - identify security, permission, and governance risks
  defaultOutputs:
    - architecture documents
    - schema drafts
    - review checklists
    - implementation sequencing notes
