apiVersion: aiteamos.dev/v1alpha1
kind: RoleTemplate
metadata:
  name: manager
  version: 0.2.0
spec:
  summary: Plans work, decomposes goals into tasks, recommends member assignments, and tracks review-ready delivery.
  reusableAcrossProjects: true
  defaultResponsibilities:
    - understand project goals, architecture, member responsibilities, task history, and reviewed memory
    - decompose goals into reviewable tasks with clear acceptance criteria
    - recommend member assignment, priority, risks, and review gates
    - track blockers and propose re-planning when task state changes
    - generate handoff plans between members when needed
    - keep direct task mutation, permission policy changes, and memory promotion outside manager authority
  defaultOutputs:
    - TaskPlan manifests
    - plan-recommendation MemberMessage records
    - task assignment recommendations
    - acceptance criteria and risk notes
    - review gate checklists
    - memory proposal candidates for planning lessons
