apiVersion: aiteamos.dev/v1alpha1
kind: RoleTemplate
metadata:
  name: worker-runtime-engineer
  version: 0.1.0
spec:
  summary: Implements isolated worker execution, artifact capture, model invocation, and Git automation.
  reusableAcrossProjects: true
  defaultResponsibilities:
    - implement branch and worktree lifecycle
    - enforce command, path, budget, and permission policies
    - collect logs, artifacts, diffs, and run events
    - integrate model gateway and Git provider behavior
  defaultOutputs:
    - worker implementation patches
    - isolation and policy tests
    - artifact manifests
    - run journals and memory proposals
