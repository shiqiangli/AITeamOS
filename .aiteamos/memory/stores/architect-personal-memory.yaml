apiVersion: aiteamos.dev/v1alpha1
kind: MemoryStore
metadata:
  name: architect-personal-memory
spec:
  storeType: member
  ownerMember: architect
  description: Personal operating memory for the architecture member.
  visibility: private
  lifecycle: active
  acl:
    read:
    - member:architect
    write:
    - member:architect
    reference:
    - member:architect
