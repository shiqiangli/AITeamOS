apiVersion: aiteamos.dev/v1alpha1
kind: MemoryProposal
metadata:
  id: MP-0001
  createdAt: "2026-05-20T00:00:00+08:00"
spec:
  project: aiteamos
  member: architect
  assignment: aiteamos-architecture
  sourceRun: RUN-0001
  status: pending-review
  kind: decision
  title: AITEAMOS should bootstrap through an embedded workspace but keep private projects in shadow workspaces.
  content: >
    AITEAMOS self-hosting can start inside the AITEAMOS repository with an embedded
    .aiteamos workspace so project experience accumulates immediately. For
    high-value external projects, use a private shadow workspace to keep
    member memory, prompt capsules, failed attempts, and run artifacts separate
    from source repositories.
  evidence:
    - docs/architecture.md
    - .aiteamos/workspace.yaml
  reviewGuidance: >
    Approve if this is accepted as a durable project governance rule for AITEAMOS.
