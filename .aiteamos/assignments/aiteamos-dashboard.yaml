apiVersion: aiteamos.dev/v1alpha1
kind: Assignment
metadata:
  name: aiteamos-dashboard
spec:
  member: frontend-human
  project: aiteamos
  roleTemplate: frontend-engineer
  title: Dashboard IA reviewer
  repositories:
  - aiteamos
  modules:
  - apps/dashboard/
  features:
  - fixed-primary-navigation
  - employees-view
  - project-operations-view
  responsibilities:
  - Review dashboard information architecture for the fixed first-level navigation.
  - Ensure Project and Employees views both project neutral resources correctly.
  scope:
    repositories:
    - aiteamos
    read:
    - apps/dashboard/**
    - docs/**
    write:
    - apps/dashboard/**
    requiresHumanReview:
    - apps/dashboard/src/main.tsx
  memoryBindings:
  - bind-aiteamos-project-memory-to-dashboard
