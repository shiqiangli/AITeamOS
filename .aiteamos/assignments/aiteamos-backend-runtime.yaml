apiVersion: aiteamos.dev/v1alpha1
kind: Assignment
metadata:
  name: aiteamos-backend-runtime
spec:
  member: backend-digital
  project: aiteamos
  roleTemplate: backend-engineer
  title: API and workspace runtime owner
  repositories:
  - aiteamos
  modules:
  - services/api/
  - packages/workspace/
  - tools/cli/
  features:
  - workspace-loader
  - derived-index
  - API-surface
  responsibilities:
  - Keep workspace protocol, loader, API, and derived index aligned with schema.
  - Preserve .aiteamos as source of truth and keep database/indexes rebuildable.
  scope:
    repositories:
    - aiteamos
    read:
    - services/api/**
    - packages/workspace/**
    - packages/schema/**
    - tools/cli/**
    - .aiteamos/**
    write:
    - services/api/**
    - packages/workspace/**
    - tools/cli/**
    - .aiteamos/**
    requiresHumanReview:
    - services/api/aiteamos_api/auth.py
    - packages/workspace/aiteamos_workspace/worker_authorization.py
  permissionPolicies:
  - digital-default
  memoryBindings:
  - bind-aiteamos-project-memory-to-backend-runtime
  evalSuiteRequirements:
  - evalSuite: aiteamos-eval-suite-schema-contract
    paths:
    - packages/schema/**
    - packages/workspace/**
    minimumPassRate: 0.95
    description: Schema and workspace runtime changes must keep the schema/workspace EvalSuite green before worker start or review.
