apiVersion: aiteamos.dev/v1alpha1
kind: Assignment
metadata:
  name: aiteamos-memory-service
spec:
  member: memory-service
  project: aiteamos
  roleTemplate: worker-runtime-engineer
  title: Memory health service
  modules:
  - packages/workspace/aiteamos_workspace/memory_engine.py
  - .aiteamos/memory/
  features:
  - memory-extraction
  - knowledge-health
  responsibilities:
  - Extract memory proposals from run journals without approving them.
  - Report stale, conflicted, or sensitive memory for review.
  scope:
    read:
    - .aiteamos/runs/**
    - .aiteamos/memory/**
    write:
    - .aiteamos/memory/proposals/**
    requiresHumanReview:
    - .aiteamos/memory/entries/**
    - .aiteamos/memory/bindings/**
  permissionPolicies:
  - service-memory-default
