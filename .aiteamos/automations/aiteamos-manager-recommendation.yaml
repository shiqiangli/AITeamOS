apiVersion: aiteamos.dev/v1alpha1
kind: Automation
metadata:
  name: aiteamos-manager-recommendation
spec:
  ownerMember: aiteamos-manager
  serviceMember: team-execution-service
  project: aiteamos
  targetType: manager_recommendation
  target:
    project: aiteamos
    managerMember: aiteamos-manager
    goal: Recommend the next bounded AITEAMOS implementation slice.
    title: AITEAMOS manager plan recommendation
    toMembers:
    - architect
    priority: high
    status: draft
    createTaskPlan: true
    subtasks:
    - title: Review the current lowest pending cleanup group and land one bounded implementation slice.
      assignedMember: architect
      assignment: aiteamos-architecture
      priority: high
      acceptance:
      - The selected cleanup group is marked Completed only after tests, workspace validate, and workspace index pass.
      - The self-hosting Task manifest cites the concrete acceptance evidence.
      risks:
      - accidental multi-DG scope expansion
      - manager bypassing Task review gates
      reviewGates:
      - human review of TaskPlan before creating Task manifests
    risks:
    - Manager recommendation must not create Task manifests directly.
    - Recommendation output remains draft review input until a human or governed service accepts it.
    reviewGates:
    - manager recommendation review
  triggers:
  - triggerType: manual
    config:
      preset: self-hosting-manager
  dryRun: false
  status: active
  permissionPolicies:
  - service-memory-default
  approvalGates: []
