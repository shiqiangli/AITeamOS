apiVersion: aiteamos.dev/v1alpha1
kind: Automation
metadata:
  name: memory-health-dry-run
spec:
  ownerMember: manager
  serviceMember: memory-service
  project: aiteamos
  targetType: memory_health
  target:
    stores:
    - aiteamos-project-memory
  triggers:
  - triggerType: manual
    config: {}
  - triggerType: memory_stale_conflict
    config:
      severity: warning
  dryRun: true
  status: active
  permissionPolicies:
  - service-memory-default
  approvalGates:
  - memory-review
