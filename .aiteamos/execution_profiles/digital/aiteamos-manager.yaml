apiVersion: aiteamos.dev/v1alpha1
kind: DigitalExecutionProfile
metadata:
  name: aiteamos-manager
spec:
  member: aiteamos-manager
  defaultModelProfile: openai-gpt-5.5-xhigh
  allowedModelProfiles:
  - openai-gpt-5.5-xhigh
  modelProfileSelection:
    evidenceEvalSuites:
    - aiteamos-manager-recommendation-quality
    latestEvalResult: ERES-20260522T215837092
    minimumPassRate: 0.5
    basis: Manager model profile selection must be backed by recent plan-recommendation outcomes paired with human accepted or rejected decisions.
  workerRuntime:
    defaultMode: manager_recommendation
    directTaskMutation: false
  contextCompiler:
    defaultProjection: manager-inbox
    includeReviewedMemoryOnly: true
  toolPolicy:
    permissionPolicy: digital-default
    nonInteractiveAsk: deny
  promptPolicy:
    requiredOutputs:
    - TaskPlan
    - MemberMessage:plan-recommendation
    prohibitedOutputs:
    - direct Task mutation
    - permission policy mutation
    - memory promotion approval
  budgetPolicies:
  - default-budget
