apiVersion: aiteamos.dev/v1alpha1
kind: TeamMember
metadata:
  name: memory-service
  title: Memory Service Account
spec:
  kind: service
  profile:
    displayName: Memory Service
    title: Memory extractor and health automation account
    status: active
    summary: Runs narrow memory extraction and knowledge-health automation under review gates.
  aboutMe:
    coreCapabilities:
    - memory extraction
    - dedupe
    - stale/conflict detection
    workStyle:
    - narrow-scope
    - audit-heavy
    workMethod:
    - preview-before-write
    - require-review-before-promotion
  permissionPolicies:
  - service-memory-default
