apiVersion: aiteamos.dev/v1alpha1
kind: TeamMember
metadata:
  name: team-execution-service
  title: Team Execution Service Account
spec:
  kind: service
  profile:
    displayName: Team Execution Service
    title: Automation account for public team-execution demos
    status: active
    summary: Queues narrow Task and Run control-plane artifacts for public Team Member OS demos.
  aboutMe:
    coreCapabilities:
    - automation trigger handling
    - assisted task/run creation
    - permission-gated control-plane writes
    workStyle:
    - narrow-scope
    - fail-closed
    - audit-first
    workMethod:
    - create-control-plane-artifacts-before-worker-execution
    - preserve-human-assisted-ingest-gates
    - avoid-private-workspace-data
  permissionPolicies:
  - service-memory-default
