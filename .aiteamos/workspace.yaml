apiVersion: aiteamos.dev/v1alpha1
kind: Workspace
metadata:
  name: aiteamos-self-hosting
  createdAt: "2026-05-20T00:00:00+08:00"
spec:
  mode: embedded
  protocolVersion: aiteamos.dev/v1alpha1
  projectRef: project.yaml
  storage:
    artifactStore:
      type: local
      path: .aiteamos/artifacts/blob
    trackedManifestsPath: .aiteamos/artifacts/manifests
  indexing:
    database: sqlite
    vectorIndex: local-derived
    derivedStatePolicy: rebuildable
  governance:
    sourceOfTruth: workspace-files
    allowCoreRepoSelfHosting: true
    requireHumanReviewFor:
      - database-schema
      - worker-sandbox
      - model-invocation-policy
      - permission-system
      - memory-promotion-rules
      - auto-merge-policy
    prohibitDirectAutomationFor:
      - security-boundary
      - secret-handling
      - production-deployment-config
