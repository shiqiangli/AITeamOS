name: Plan v7 Verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full:
        description: "Run broader backend contract tests"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      include_frontend:
        description: "Run dashboard tests and build"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      include_agent_server_smoke:
        description: "Run local Agent Server approval/resume smoke"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      include_agent_server_matrix_smoke:
        description: "Run Agent Server read-only, answer-only, provider-blocker, and approval/resume smoke"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      production_readiness:
        description: "Run strict production readiness profile without live provider dogfood mutation"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  plan-v7-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Set up Node
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_frontend == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dashboard dependencies
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_frontend == 'true' }}
        working-directory: apps/dashboard
        run: npm ci

      - name: Run plan v7 verification
        env:
          AITEAMOS_WORKSPACE_DIR: ${{ github.workspace }}/.aiteamos-ci-workspace
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full }}" = "true" ]; then
            ARGS="$ARGS --full"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.include_frontend }}" = "true" ]; then
            ARGS="$ARGS --include-frontend"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.include_agent_server_smoke }}" = "true" ]; then
            ARGS="$ARGS --include-agent-server-smoke"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.include_agent_server_matrix_smoke }}" = "true" ]; then
            ARGS="$ARGS --include-agent-server-matrix-smoke"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.production_readiness }}" = "true" ]; then
            ARGS="$ARGS --production-readiness"
          fi
          python scripts/plan_v7_ci_artifacts.py --run-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" $ARGS

      - name: Upload plan v7 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan-v7-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .aiteamos/artifacts/plan_v7/github-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
